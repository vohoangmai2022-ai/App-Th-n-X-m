<!DOCTYPE html>
<html lang="vi" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Thôn Xóm - Kết Nối Dân Cán Bộ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- File CSS riêng -->
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1b4d3e',
                        secondary: '#d97706',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Header & Area Info -->
    <header class="bg-primary text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center overflow-hidden border border-white/30">
                    <img id="header-avatar" src="https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&q=80&w=100" alt="Bìa" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide flex items-center gap-2">
                        <span id="display-khu-vuc">Thôn Xóm Bình An</span>
                        <span class="text-xs bg-secondary px-2 py-0.5 rounded-full font-normal text-white">Chính Thức</span>
                    </h1>
                    <p class="text-xs text-gray-200" id="display-phuong-tỉnh">Phường Phước Long, Tỉnh Vĩnh Long</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleDarkMode()" class="bg-white/10 hover:bg-white/20 text-white text-xs px-2.5 py-2 rounded-lg transition" title="Đổi giao diện Sáng / Tối">
                    <i id="dark-mode-icon" class="fa-solid fa-moon"></i>
                </button>
                <div id="header-emergency-buttons" class="flex items-center space-x-2"></div>
                <button onclick="openLoginModal()" class="bg-white/10 hover:bg-white/20 border border-white/30 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-user-lock"></i> <span id="auth-btn-text">Cán Bộ Đăng Nhập</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Banner / Cover Area -->
    <section class="relative bg-gray-900 text-white h-48 md:h-64 overflow-hidden shadow-inner">
        <img id="cover-image-display" src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&q=80&w=1600" class="w-full h-full object-cover opacity-75 transition-all duration-500" alt="Ảnh bìa khu vực">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent flex flex-col justify-end p-6">
            <div class="max-w-7xl mx-auto w-full">
                <span class="text-xs uppercase tracking-widest bg-secondary text-white px-2.5 py-1 rounded font-semibold">Cổng Thông Tin Số & Tương Tác</span>
                <h2 class="text-2xl md:text-3xl font-extrabold mt-1 text-white drop-shadow">Kết Nối Trách Nhiệm - Xây Dựng Thôn Xóm Văn Minh</h2>
                <p class="text-xs md:text-sm text-gray-200 mt-1">Hệ thống tương tác trực tiếp
